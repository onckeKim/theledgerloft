name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SITE_URL: http://localhost:3100
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder_for_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run check:tokens
      - run: npm run check:calc
      - run: npm audit --audit-level=high --omit=dev
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  database:
    # Local Supabase stack: migrations from scratch and seed, every SQL test file, and every end-to-end flow that needs
    # a database (setup, budget, goals and debts, review and export, payments).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:start
      - run: npm run db:test
      - name: Export local stack keys (well-known local defaults, not secrets)
        run: |
          npx supabase status -o env > .supabase-status
          echo "E2E_SUPABASE_URL=$(grep '^API_URL=' .supabase-status | cut -d= -f2- | tr -d '"')" >> "$GITHUB_ENV"
          echo "E2E_SUPABASE_PUBLISHABLE_KEY=$(grep '^PUBLISHABLE_KEY=' .supabase-status | cut -d= -f2- | tr -d '"')" >> "$GITHUB_ENV"
          echo "E2E_SUPABASE_SERVICE_KEY=$(grep '^SERVICE_ROLE_KEY=' .supabase-status | cut -d= -f2- | tr -d '"')" >> "$GITHUB_ENV"
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3100
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-database
          path: playwright-report/
          retention-days: 7
